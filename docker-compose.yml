version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supply_chain_postgres
    environment:
      POSTGRES_DB: supply_chain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: supply_chain_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/supply_chain_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-claude}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
